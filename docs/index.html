<!doctype html>
<html lang="en" data-edu="off">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<title>STICK FIGHT</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Rajdhani:wght@500;700&family=Patrick+Hand&display=swap" rel="stylesheet">

<style>
  :root {
    --bg-0:#0a0512; --bg-1:#150925; --bg-2:#22103a; --bg-3:#341a55;
    --ink:#fbeacc; --ink-2:#c9b4dc; --ink-3:#7a6a92;
    --fire-1:#ff4d2e; --fire-2:#ff9a3c; --fire-3:#ffd76a;
    --good:#5bff8a; --danger:#ff5b6e;
    --line:rgba(255,255,255,.10); --line-2:rgba(255,255,255,.20);
    --card-bg:rgba(20,10,38,.85);
  }
  html[data-edu="on"] {
    --bg-0:#06140a; --bg-1:#0a2014; --bg-2:#103420; --bg-3:#1a5436;
    --fire-1:#5bd58a; --fire-2:#9be36c; --fire-3:#f0ffb0;
    --ink:#eaffe6;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg-0);color:var(--ink);font-family:'Rajdhani',system-ui,sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none}
  body{
    background:
      radial-gradient(ellipse at 50% 110%, var(--fire-1) 0%, transparent 55%),
      radial-gradient(ellipse at 20% 90%, var(--fire-2) 0%, transparent 35%),
      radial-gradient(ellipse at 80% 95%, var(--fire-2) 0%, transparent 30%),
      linear-gradient(180deg, var(--bg-0) 0%, var(--bg-1) 55%, var(--bg-2) 100%);
  }
  #root{height:100vh;width:100vw;position:relative}
  .center{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;overflow-y:auto;overflow-x:hidden}
  .title-art{font-family:'Bebas Neue',sans-serif;font-size:clamp(64px,12vw,180px);line-height:.85;letter-spacing:.02em;
    color:var(--fire-1);
    text-shadow:
      0 2px 0 #6c1a0e, 0 4px 0 #4a1208, 0 6px 0 #2e0a04,
      0 10px 40px rgba(255,77,46,.6);
    transform:rotate(-3deg);
    -webkit-text-stroke:2px #2a0a06;
  }
  .title-sub{font-family:'Patrick Hand',cursive;font-size:clamp(20px,3vw,42px);color:#fff;margin-top:-.2em;
    text-shadow:0 2px 8px rgba(0,0,0,.6); transform:rotate(-1deg);
  }
  .panel{background:var(--card-bg);border:1px solid var(--line-2);border-radius:18px;padding:22px;backdrop-filter:blur(8px)}
  button.btn, .btn{
    appearance:none;cursor:pointer;font-family:'Rajdhani',sans-serif;font-weight:700;font-size:18px;letter-spacing:.06em;
    text-transform:uppercase;color:#fff;background:linear-gradient(180deg,var(--fire-2),var(--fire-1));
    border:none;border-radius:10px;padding:12px 22px;box-shadow:0 4px 0 #6c1a0e,0 8px 20px rgba(255,77,46,.4);
    transition:transform .08s, box-shadow .08s;
  }
  .btn:hover{transform:translateY(-2px);box-shadow:0 6px 0 #6c1a0e,0 10px 24px rgba(255,77,46,.5)}
  .btn:active{transform:translateY(2px);box-shadow:0 2px 0 #6c1a0e}
  .btn.ghost{background:transparent;border:2px solid var(--line-2);box-shadow:none;color:var(--ink)}
  .btn.ghost:hover{background:rgba(255,255,255,.05)}
  .btn.big{font-size:28px;padding:18px 48px}
  .btn[disabled]{opacity:.45;cursor:not-allowed;filter:grayscale(.4)}
  .btn.sm{font-size:14px;padding:8px 14px}
  .row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
  .col{display:flex;flex-direction:column;gap:12px}
  .grid{display:grid;gap:14px}
  .pill{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:rgba(255,255,255,.06);border:1px solid var(--line);font-weight:600;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
  .pill.on{background:linear-gradient(180deg,var(--fire-2),var(--fire-1));color:#fff;border-color:transparent}
  .seg{display:inline-flex;background:rgba(0,0,0,.3);border:1px solid var(--line);border-radius:10px;padding:4px;gap:4px}
  .seg button{appearance:none;background:transparent;border:none;color:var(--ink-2);font:600 14px 'Rajdhani';padding:8px 14px;border-radius:7px;cursor:pointer;letter-spacing:.06em;text-transform:uppercase}
  .seg button.on{background:linear-gradient(180deg,var(--fire-2),var(--fire-1));color:#fff}
  .seg button[disabled]{opacity:.4;cursor:not-allowed}
  input[type="text"]{background:rgba(0,0,0,.35);border:1px solid var(--line-2);color:var(--ink);border-radius:8px;padding:8px 12px;font:600 16px 'Rajdhani';outline:none}
  input[type="text"]:focus{border-color:var(--fire-2)}
  .scroll-x{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px}
  .scroll-x::-webkit-scrollbar{height:6px}
  .scroll-x::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:3px}
  .toast{position:absolute;bottom:24px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.8);padding:10px 18px;border-radius:8px;border:1px solid var(--line-2);font-weight:600;animation:fade 2.4s ease forwards;pointer-events:none}
  @keyframes fade{0%{opacity:0;transform:translate(-50%,8px)}10%{opacity:1;transform:translate(-50%,0)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-8px)}}
  .kbd{font-family:'JetBrains Mono',monospace;background:#000;border:1px solid var(--line-2);border-bottom-width:3px;border-radius:5px;padding:1px 6px;font-size:12px;color:var(--ink)}
  .glow{filter:drop-shadow(0 0 12px var(--fire-1))}
  canvas#game{display:block;background:transparent;image-rendering:pixelated}
  .vignette{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at center, transparent 50%, rgba(0,0,0,.55) 100%)}
  .float-emoji{position:absolute;font-size:22px;pointer-events:none;opacity:.4}
  .mode-card{background:linear-gradient(180deg, rgba(30,15,50,.92), rgba(15,8,30,.92));border:2px solid var(--line);border-radius:16px;padding:14px;cursor:pointer;transition:transform .12s, border-color .15s, background .15s;text-align:left;display:flex;flex-direction:column;gap:6px;min-height:104px;position:relative;overflow:hidden}
  .mode-card:hover{transform:translateY(-3px);border-color:var(--fire-2)}
  .mode-card.on{border-color:var(--fire-1);background:linear-gradient(180deg, rgba(60,25,80,.95), rgba(30,12,50,.95));box-shadow:0 0 0 3px rgba(255,77,46,.18), 0 6px 18px rgba(255,77,46,.25)}
  .mode-card[disabled]{cursor:not-allowed;opacity:.55;filter:grayscale(.4)}
  .mode-card[disabled]:hover{transform:none;border-color:var(--line)}
  .mode-card .mc-icon{width:42px;height:42px;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.05);border-radius:10px}
  .mode-card .mc-name{font-family:'Bebas Neue';font-size:22px;letter-spacing:.04em;color:var(--ink)}
  .mode-card .mc-desc{font-size:12.5px;color:var(--ink-2);line-height:1.35}
  .mode-card .mc-soon{position:absolute;top:8px;right:8px;font-size:10px;letter-spacing:.18em;color:var(--ink-3);background:rgba(0,0,0,.4);padding:3px 7px;border-radius:6px;text-transform:uppercase}
  .mode-grid{display:grid;grid-template-columns:repeat(auto-fill, minmax(220px, 1fr));gap:10px}
  .section-card{background:rgba(15,8,30,.5);border:1px solid var(--line);border-radius:14px;padding:14px 18px;margin-bottom:10px}
  .section-card .sc-h{font-size:12px;letter-spacing:.18em;color:var(--ink-3);text-transform:uppercase;margin-bottom:10px;font-weight:700}
  .powerup-card{background:linear-gradient(180deg, rgba(40,15,70,.95), rgba(20,8,40,.95));border:2px solid var(--line-2);border-radius:18px;padding:18px;width:230px;cursor:pointer;transition:transform .15s, border-color .15s;text-align:center}
  .powerup-card:hover{transform:translateY(-6px) rotate(-1deg);border-color:var(--fire-2)}
  .powerup-card .icon{font-size:48px;line-height:1;margin:8px 0}
  .powerup-card .name{font-family:'Bebas Neue';font-size:24px;letter-spacing:.05em;color:var(--fire-3)}
  .powerup-card .desc{font-size:14px;color:var(--ink-2);min-height:48px;margin-top:6px}
  .powerup-card .cat{font-size:11px;text-transform:uppercase;letter-spacing:.15em;color:var(--ink-3);margin-bottom:4px}
  .hat-tile{width:74px;height:74px;border-radius:12px;background:rgba(0,0,0,.3);border:2px solid var(--line);display:flex;align-items:center;justify-content:center;cursor:pointer;flex:0 0 auto;transition:border-color .15s}
  .hat-tile:hover{border-color:var(--fire-2)}
  .hat-tile.on{border-color:var(--fire-1);box-shadow:0 0 0 3px rgba(255,77,46,.25)}
  .color-tile{width:36px;height:36px;border-radius:8px;cursor:pointer;border:3px solid transparent}
  .color-tile.on{border-color:#fff}
</style>
</head>
<body>

<div id="root"></div>

<script type="text/babel" src="data.jsx?v=75"></script>
<script type="text/babel" src="game.jsx?v=75"></script>
<script type="text/babel" src="app.jsx?v=75"></script>

</body>
</html>
